services:
  redis:
    image: redis:7-alpine
    container_name: video_streaming-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass video --appendonly yes --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "video", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
